<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai-finance</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 70% 50% at 50% 0%, rgba(79, 140, 255, 0.12), transparent 55%),
          #10141a;
        color: rgba(255, 255, 255, 0.92);
        padding: 32px;
        text-align: center;
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        margin: 0 auto 16px;
        background: linear-gradient(135deg, #4f8cff 0%, #6ee7d2 100%);
        box-shadow: 0 10px 28px rgba(79, 140, 255, 0.28);
      }
      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 650;
      }
      p {
        margin: 14px auto 0;
        max-width: 520px;
        font-size: 14px;
        line-height: 1.6;
        opacity: 0.72;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12px;
        color: #8eb6ff;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark" aria-hidden="true"></div>
      <h1>无法连接 Web 服务</h1>
      <p>
        桌面客户端需要可访问的 ai-finance Web 地址。<br />
        开发环境请先运行 <code>pnpm dev:web</code>，或重新打包时设置
        <code>WEB_URL</code> 指向已部署的站点。
      </p>
      <p id="target"></p>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const url = params.get("url");
      if (url) {
        document.getElementById("target").textContent = "当前地址：" + url;
      }
    </script>
  </body>
</html>
